# W55RP20-S2E.yaml
# 고속 Baudrate + SSL/MQTT + 연결 이벤트 데이터 지원
# 소스 기준: wizcmdset.py W55RP20_CMDSET

name: W55RP20-S2E
display_name: "W55RP20-S2E"
aliases:
  - "W55RP20-S2E"
family: security
channels: 1
search_cmd_order:
  - MC
  - VR
  - MN
  - IM
  - OP
  - CP
  - DG
  - KA
  - KI
  - KE
  - RI
  - LI
  - SM
  - GW
  - DS
  - DH
  - LP
  - RP
  - RH
  - BR
  - DB
  - PR
  - SB
  - FL
  - IT
  - PT
  - PS
  - PD
  - TE
  - SS
  - NP
  - SP
  - UN
  - ST
  - EC
  - SC
  - TR
  - QU
  - QP
  - QC
  - QK
  - PU
  - U0
  - U1
  - U2
  - QO
  - RC
  - CE
  - SD
  - DD
  - SE

command_groups:
  - base
  - retransmit
  - security
  - w55rp20_ext
  # 2026-09-08: FW segcp.h(1-UART enum, DEVICE_UART_CNT==1)에 있는 것만 넣는다.
  # gpio(CA~CD/GA~GD/SC/S0/S1)·modbus(MB PO)·retransmit(TR EC) 는 enum 에 전부 있다.
  # PO 는 telnet 이 아니라 modbus 쪽 정의를 쓴다 — 이 펌웨어에서 PO 는
  # 시리얼 프로토콜(0~2) 선택자다(segcp.c:795, uartHandler.h:94).
  - modbus
  - gpio

# 그룹 전체가 아니라 이것만 — RP2040 펌웨어의 DDNS 는 도메인(DH) 하나뿐이고
# DD DX DP DI DW 는 segcp.h enum 에 없다. 통째로 넣으면 spec 이 펌웨어에 없는
# 커맨드를 가졌다고 주장하게 된다. (2026-09-08 FW 대조)
partial_command_groups:
  ddns: [DH]


overrides:
  # [FW 소스 대조 2026-10-20] 칸 크기-1 = 최대 글자 수. 이 값을 넘기면 오류 없이 이웃 필드가
  # 덮이거나(검사 없는 strcpy) INVALIDPARAM 으로 같은 요청의 SV 가 취소된다.
  # 근거: doc/fw/FW-SOURCE-w55rp20-other-branches §7 #1,#2,#3,#5 (main)
  RH:
    regex: "^(?=.{0,127}$)( ?|(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])|([A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?\\.)*[A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?)$"
  SP:
    regex: "^.{0,9}$"
  QU:
    regex: "^.{0,127}$"
  QP:
    regex: "^.{0,127}$"
  QC:
    regex: "^.{0,127}$"
  PU:
    regex: "^.{0,127}$"
  U0:
    regex: "^.{0,127}$"
  U1:
    regex: "^.{0,127}$"
  U2:
    regex: "^.{0,127}$"
  # NP(연결 비밀번호) — FW pw_connect[10] (W55RP20/WIZ5XXSR-RP 계열 공통, 2026-10-14 확인)
  NP:
    regex: "^.{0,9}$"
  # 고속 Baudrate (FW >= 1.2.1에서 index 0-19 지원)
  # FW 버전에 따라 device_spec_loader가 런타임에 조정
  BR:
    regex: "^([0-9]|1[0-9])$"
    values:
      "0": "300"
      "1": "600"
      "2": "1200"
      "3": "1800"
      "4": "2400"
      "5": "4800"
      "6": "9600"
      "7": "14400"
      "8": "19200"
      "9": "28800"
      "10": "38400"
      "11": "57600"
      "12": "115200"
      "13": "230400"
      "14": "460800"
      "15": "921600"
      "16": {value: "1M", min_version: "1.2.1"}
      "17": {value: "2M", min_version: "1.2.1"}
      "18": {value: "4M", min_version: "1.2.1"}
      "19": {value: "8M", min_version: "1.2.1"}
  OP:
    regex: "^[0-6]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
      "4": "SSL TCP Client mode"
      "5": "MQTT Client"
      "6": "MQTTS Client"

fw_constraints:
  upload_supported: true
  config_port: 50001
  # SEGCP 요청/응답 버퍼 크기 (common.h CONFIG_BUF_SIZE). W55RP20-S2E 소스 확인 —
  # W7500 계열 512 에서 2048 로 확장돼 있어 여유가 크다. 설정툴은 응답이 여기
  # 닿았는지 사후 검출하는 데만 쓴다. (4CH 담당자 전언 2026-10-19: 응답이 버퍼를 넘길 때 잘라 보내는
  # 패치는 4CH 빌드에만 있다 — 이 빌드는 초과 시 메모리가 덮이고 대응 코드가 없다.)
  config_buf_size: 2048

ui:
  tabs:
    - id: network
      label: "Network"
      groups:
        - device_info
        - ip_mode
        - op_mode
        - conn_password
        - ssl_options
    - id: serial
      label: "Serial"
      groups:
        - serial_info
        - serial_params
        - data_packing
    - id: options
      label: "Options"
      groups:
        - inactivity
        - keepalive
        - trigger
        - search_password
        - tcp_options
        - connection_events
    - id: mqtt
      label: "MQTT"
      groups:
        - mqtt_options
        - mqtt_topics
    - id: certificate
      label: "Certificate"
      groups:
        - cert_options
        - cert_upload

# 펌웨어 이미지 판별 프로파일 — config/fw_image_defaults.yaml 참조
fw_image:
  profile: rp2040_w55rp20
