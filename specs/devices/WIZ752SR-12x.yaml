# WIZ752SR-12x.yaml
# 2포트 S2E 장비
# 소스 기준: WIZMakeCMD.py TWO_PORT_DEV, wizcmdset.py WIZ752_CMDSET

name: WIZ752SR-12x
display_name: "WIZ752SR-12x"
aliases:
  - "WIZ752SR-12x"
  - "WIZ752SR-120"
  - "WIZ752SR-125"
family: two_port
channels: 2
search_cmd_order:
  - MC
  - VR
  - MN
  - UN
  - ST
  - QS
  - EN
  - IM
  - OP
  - QO
  - CP
  - DG
  - KA
  - RA
  - KI
  - RS
  - KE
  - RE
  - RI
  - RR
  - LI
  - SM
  - GW
  - DS
  - LP
  - QL
  - RP
  - QP
  - RH
  - QH
  - BR
  - EB
  - DB
  - ED
  - PR
  - EP
  - SB
  - ES
  - FL
  - EF
  - IT
  - RV
  - PT
  - NT
  - PS
  - NS
  - PD
  - ND
  - TE
  - SS
  - NP
  - SP
  - S0
  - S1
  - SC

command_groups:
  - base
  - two_port
  - gpio  # TODO: 실장치 테스트 후 확인 — WIZ750SR과 동일 4핀(A~D)인지, 2핀(A,B)만 지원인지 미확정

overrides:
  # WIZ752SR BR 최대 230400 (0-13)
  BR:
    regex: "^([0-9]|1[0-3])$"
    values:
      "0": "300"
      "1": "600"
      "2": "1200"
      "3": "1800"
      "4": "2400"
      "5": "4800"
      "6": "9600"
      "7": "14400"
      "8": "19200"
      "9": "28800"
      "10": "38400"
      "11": "57600"
      "12": "115200"
      "13": "230400"

fw_constraints:
  upload_supported: true
  config_port: 50001
  # SEGCP 요청/응답 버퍼 gSEGCPREQ/gSEGCPREP 크기 (common.h CONFIG_BUF_SIZE). 펌웨어가
  # 응답 길이를 대조하지 않으므로 설정툴이 응답이 여기 닿았는지 사후 검출하는 데 쓴다.
  config_buf_size: 512

ui:
  tabs:
    - id: network
      label: "Network"
      groups:
        - device_info
        - ip_mode
        - op_mode
        - conn_password
    - id: serial
      label: "Serial (CH0)"
      groups:
        - serial_info
        - serial_params
        - data_packing
    - id: channel1
      label: "Channel 1"
      groups:
        - ch1_info
        - ch1_op_mode
        - ch1_serial
        - ch1_packing
        - ch1_options
    - id: userio
      label: "User I/O"
      groups:
        - gpio
    - id: options
      label: "Options"
      groups:
        - inactivity
        - keepalive
        - trigger
        - search_password

# 펌웨어 이미지 판별 프로파일 — config/fw_image_defaults.yaml 참조
fw_image:
  profile: w7500
