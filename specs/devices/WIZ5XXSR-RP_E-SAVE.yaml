# WIZ5XXSR-RP_E-SAVE.yaml
# 보안 S2E 장비 E-SAVE 변형 (SSL/MQTT 지원)
# 소스 기준: WIZMakeCMD.py SECURITY_DEVICE, cmd_security_base + cmd_wiz5xxsr_added
# E-SAVE 전용 커맨드(U3~U9)는 현재 비활성 (#cmd_wiz5xxsr_esave 주석 처리됨)

name: WIZ5XXSR-RP_E-SAVE
display_name: "WIZ5XXSR-RP_E-SAVE"
aliases:
  - "WIZ5XXSR-RP_E-SAVE"
family: security
channels: 1
search_cmd_order:
  - MC
  - VR
  - MN
  - IM
  - OP
  - CP
  - DG
  - KA
  - KI
  - KE
  - RI
  - LI
  - SM
  - GW
  - DS
  - DH
  - LP
  - RP
  - RH
  - BR
  - DB
  - PR
  - SB
  - FL
  - IT
  - PT
  - PS
  - PD
  - TE
  - SS
  - NP
  - SP
  - UN
  - ST
  - EC
  - SC
  - TR
  - QU
  - QP
  - QC
  - QK
  - PU
  - U0
  - U1
  - U2
  - QO
  - RC
  - CE
  - SO
  - UF

command_groups:
  - base
  - security
  # 2026-09-08: FW segcp.h(1-UART enum, DEVICE_UART_CNT==1)에 있는 것만 넣는다.
  # gpio(CA~CD/GA~GD/SC/S0/S1)·modbus(MB PO)·retransmit(TR EC) 는 enum 에 전부 있다.
  # PO 는 telnet 이 아니라 modbus 쪽 정의를 쓴다 — 이 펌웨어에서 PO 는
  # 시리얼 프로토콜(0~2) 선택자다(segcp.c:795, uartHandler.h:94).
  - retransmit
  - modbus
  - gpio

# 그룹 전체가 아니라 이것만 — RP2040 펌웨어의 DDNS 는 도메인(DH) 하나뿐이고
# DD DX DP DI DW 는 segcp.h enum 에 없다. 통째로 넣으면 spec 이 펌웨어에 없는
# 커맨드를 가졌다고 주장하게 된다. (2026-09-08 FW 대조)
partial_command_groups:
  ddns: [DH]


overrides:
  # BR: WIZ5XXSR-RP_E-SAVE 최대 460800 (index 0-14)
  BR:
    regex: "^([0-9]|1[0-4])$"
    values:
      "0": "300"
      "1": "600"
      "2": "1200"
      "3": "1800"
      "4": "2400"
      "5": "4800"
      "6": "9600"
      "7": "14400"
      "8": "19200"
      "9": "28800"
      "10": "38400"
      "11": "57600"
      "12": "115200"
      "13": "230400"
      "14": "460800"
  # SSL/MQTT 지원하는 OP 확장
  OP:
    regex: "^[0-6]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
      "4": "SSL TCP Client mode"
      "5": "MQTT Client"
      "6": "MQTTS Client"

fw_constraints:
  upload_supported: true
  config_port: 50001

ui:
  tabs:
    - id: network
      label: "Network"
      groups:
        - device_info
        - ip_mode
        - op_mode
        - conn_password
        - ssl_options
    - id: serial
      label: "Serial"
      groups:
        - serial_info
        - serial_params
        - data_packing
    - id: options
      label: "Options"
      groups:
        - inactivity
        - keepalive
        - trigger
        - search_password
        - tcp_options
    - id: mqtt
      label: "MQTT"
      groups:
        - mqtt_options
        - mqtt_topics
    - id: certificate
      label: "Certificate"
      groups:
        - cert_options
        - cert_upload

# 펌웨어 이미지 판별 프로파일 — config/fw_image_defaults.yaml 참조
fw_image:
  profile: rp2040_5xx
