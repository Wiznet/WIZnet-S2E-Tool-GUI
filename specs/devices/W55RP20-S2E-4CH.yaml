  XS:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  XE:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  ZS:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  ZE:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"

fw_constraints:
  upload_supported: true
  config_port: 50001
  # SEGCP 응답 버퍼 — 4CH 담당자 확인(2026-10-19, FW 커밋 90af22e 기준).
  # · 응답 중 **남은 공간이 256B 미만**이 되면 그 뒤 명령은 응답하지 않고 거기서 잘라 보낸다
  #   ("256B 를 더하는 여유분"이 아니라 2048B 중 남은 양이 기준). 이 절단은 **4CH 빌드에만 있는
  #   패치**다 — 다른 빌드는 응답이 버퍼를 넘기면 메모리가 덮여 요청 버퍼가 깨지고 대응 코드가 없다.
  # · UDP 는 1472B 를 넘으면 한 패킷에 안 들어가고 W5500 이 IP 조각내기를 지원하지 않아 유실될 수 있다
  #   (공장 기본값 응답은 약 920B).
  # · 잘린 응답은 **조회한 명령이 응답에 아예 없다**는 모양이다(값이 빈 것과 다름 — 설정한 적 없는
  #   값은 "PI" 처럼 명령어만 온다). 툴의 [SIZE] 경고는 응답이 2048B 에 닿을 때만 울려 이 절단은
  #   직접 잡지 못한다. 응답에 빠진 명령이 있으면 경고하는 안은 TASKS.md TODO-REPLY-MISSING-CMDS.
  # · PI/PP GET: Static IP 상태에서도 **이미 설정된 값이 응답된다.** 설정한 적이 없으면 명령어만 온다.
  config_buf_size: 2048

ui:
