      "14": "460800"
      "15": "921600"
      "16": {value: "1M", min_version: "1.2.1"}
      "17": {value: "2M", min_version: "1.2.1"}
      "18": {value: "4M", min_version: "1.2.1"}
      "19": {value: "8M", min_version: "1.2.1"}
  WB:
    regex: "^([0-9]|1[0-9])$"
    values:
      "0": "300"
      "1": "600"
      "2": "1200"
      "3": "1800"
      "4": "2400"
      "5": "4800"
      "6": "9600"
      "7": "14400"
      "8": "19200"
      "9": "28800"
      "10": "38400"
      "11": "57600"
      "12": "115200"
      "13": "230400"
      "14": "460800"
      "15": "921600"
      "16": {value: "1M", min_version: "1.2.1"}
      "17": {value: "2M", min_version: "1.2.1"}
      "18": {value: "4M", min_version: "1.2.1"}
      "19": {value: "8M", min_version: "1.2.1"}
  YB:
    regex: "^([0-9]|1[0-9])$"
    values:
      "0": "300"
      "1": "600"
      "2": "1200"
      "3": "1800"
      "4": "2400"
