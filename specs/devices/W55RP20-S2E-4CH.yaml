  # OP/AO/TO/JO — 3CH/4CH 펌웨어는 SSL/MQTT 미지원, 0~3(TCP client/server/mixed/UDP)만 유효.
  # 4~6은 ERINVALIDPARAM. 근거: FW 문서 W55RP20_ConfigTool_main_vs_4Port_KR.md(2026-09-23) 표3.
  OP:
    regex: "^[0-3]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
  AO:
    regex: "^[0-3]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
  TO:
    regex: "^[0-3]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
  JO:
    regex: "^[0-3]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
  # FL/EF/WF/YF — 3CH/4CH 펌웨어는 DTR/DSR(5)까지 지원. 근거: 위 문서 표3, 커밋 00b30e9.
  FL:
    regex: "^[0-5]$"
    values:
      "0": "NONE"
      "1": "XON/XOFF"
      "2": "RTS/CTS"
      "3": "RTS on TX"
      "4": "RTS on TX (invert)"
      "5": "DTR/DSR"
  EF:
    regex: "^[0-5]$"
    values:
      "0": "NONE"
      "1": "XON/XOFF"
      "2": "RTS/CTS"
      "3": "RTS on TX"
      "4": "RTS on TX (invert)"
      "5": "DTR/DSR"
  WF:
    regex: "^[0-5]$"
    values:
      "0": "NONE"
      "1": "XON/XOFF"
      "2": "RTS/CTS"
      "3": "RTS on TX"
      "4": "RTS on TX (invert)"
      "5": "DTR/DSR"
  YF:
    regex: "^[0-5]$"
    values:
      "0": "NONE"
      "1": "XON/XOFF"
      "2": "RTS/CTS"
      "3": "RTS on TX"
      "4": "RTS on TX (invert)"
      "5": "DTR/DSR"
  # KI/KE(ch0)·RS/RE(ch1)·XS/XE(ch2)·ZS/ZE(ch3) keep-alive 간격 — 3CH/4CH 는 1000ms 미만
  # ERINVALIDPARAM. 근거: 위 문서 표3.
  KI:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  KE:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  RS:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  RE:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  XS:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  XE:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  ZS:
    regex: "^(1000|100[1-9]|10[1-9][0-9]|1[1-9][0-9]{2}|[2-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  ZE:
