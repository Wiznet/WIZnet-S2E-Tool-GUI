      "19": {value: "8M", min_version: "1.2.1"}
  # OP/AO/TO/JO — 3CH/4CH 펌웨어는 SSL/MQTT 미지원, 0~3(TCP client/server/mixed/UDP)만 유효.
  # 4~6은 ERINVALIDPARAM. 근거: FW 문서 W55RP20_ConfigTool_main_vs_4Port_KR.md(2026-09-23) 표3.
  OP:
    regex: "^[0-3]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
  AO:
    regex: "^[0-3]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
  TO:
    regex: "^[0-3]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
  JO:
    regex: "^[0-3]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
  # FL/EF/WF/YF — 3CH/4CH 펌웨어는 DTR/DSR(5)까지 지원. 근거: 위 문서 표3, 커밋 00b30e9.
  FL:
    regex: "^[0-5]$"
    values:
      "0": "NONE"
      "1": "XON/XOFF"
      "2": "RTS/CTS"
      "3": "RTS on TX"
      "4": "RTS on TX (invert)"
      "5": "DTR/DSR"
  EF:
