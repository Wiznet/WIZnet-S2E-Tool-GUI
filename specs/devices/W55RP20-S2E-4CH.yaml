      "1": "XON/XOFF"
      "2": "RTS/CTS"
      "3": "RTS on TX"
      "4": "RTS on TX (invert)"
      "5": "DTR/DSR"
  WF:
    regex: "^[0-5]$"
    values:
      "0": "NONE"
      "1": "XON/XOFF"
      "2": "RTS/CTS"
      "3": "RTS on TX"
      "4": "RTS on TX (invert)"
      "5": "DTR/DSR"
  YF:
    regex: "^[0-5]$"
    values:
      "0": "NONE"
      "1": "XON/XOFF"
      "2": "RTS/CTS"
      "3": "RTS on TX"
      "4": "RTS on TX (invert)"
      "5": "DTR/DSR"
  # KI/KE(ch0)·RS/RE(ch1)·XS/XE(ch2)·ZS/ZE(ch3) keep-alive 간격 — 3CH/4CH 는 1000ms 미만
  # ERINVALIDPARAM. 근거: 위 문서 표3.
  KI:
