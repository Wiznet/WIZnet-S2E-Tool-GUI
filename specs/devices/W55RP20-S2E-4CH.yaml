      groups:
        - ch2_info
        - ch2_op_mode
        - ch2_serial
        - ch2_packing
        - ch2_options
        - ch2_connection_events
    - id: channel3
      label: "Channel 3"
      groups:
        - ch3_info
        - ch3_op_mode
        - ch3_serial
        - ch3_packing
        - ch3_options
        - ch3_connection_events
    - id: options
      label: "Options"
      groups:
        - inactivity
        - keepalive
        - trigger
        - search_password
        - tcp_options
        - connection_events
    - id: mqtt
      label: "MQTT"
