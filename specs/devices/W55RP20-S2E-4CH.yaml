      groups:
        - serial_info
        - serial_params
        - data_packing
    - id: channel1
      label: "Channel 1"
      groups:
        - ch1_info
        - ch1_op_mode
        - ch1_serial
        - ch1_packing
        - ch1_options
        - ch1_connection_events
    - id: channel2
