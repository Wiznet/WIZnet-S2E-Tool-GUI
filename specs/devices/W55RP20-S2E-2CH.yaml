# W55RP20-S2E-2CH.yaml
# 2채널 고속 S2E 장비
# 소스 기준: wizcmdset.py W55RP20_2CH_CMDSET

name: W55RP20-S2E-2CH
display_name: "W55RP20-S2E-2CH"
aliases:
  - "W55RP20-S2E-2CH"
family: security_two_port
channels: 2

command_groups:
  - base
  - retransmit
  - security
  - w55rp20_ext
  - w55rp20_two_port
  # 2026-09-08: FW segcp.h(1-UART enum, DEVICE_UART_CNT==1)에 있는 것만 넣는다.
  # gpio(CA~CD/GA~GD/SC/S0/S1)·modbus(MB PO)·retransmit(TR EC) 는 enum 에 전부 있다.
  # PO 는 telnet 이 아니라 modbus 쪽 정의를 쓴다 — 이 펌웨어에서 PO 는
  # 시리얼 프로토콜(0~2) 선택자다(segcp.c:795, uartHandler.h:94).
  - modbus
  - gpio

# 그룹 전체가 아니라 이것만 — RP2040 펌웨어의 DDNS 는 도메인(DH) 하나뿐이고
# DD DX DP DI DW 는 segcp.h enum 에 없다. 통째로 넣으면 spec 이 펌웨어에 없는
# 커맨드를 가졌다고 주장하게 된다. (2026-09-08 FW 대조)
partial_command_groups:
  ddns: [DH]


overrides:
  BR:
    regex: "^([0-9]|1[0-9])$"
    values:
      "0": "300"
      "1": "600"
      "2": "1200"
      "3": "1800"
      "4": "2400"
      "5": "4800"
      "6": "9600"
      "7": "14400"
      "8": "19200"
      "9": "28800"
      "10": "38400"
      "11": "57600"
      "12": "115200"
      "13": "230400"
      "14": "460800"
      "15": "921600"
      "16": {value: "1M", min_version: "1.2.1"}
      "17": {value: "2M", min_version: "1.2.1"}
      "18": {value: "4M", min_version: "1.2.1"}
      "19": {value: "8M", min_version: "1.2.1"}
  EB:
    regex: "^([0-9]|1[0-9])$"
    values:
      "0": "300"
      "1": "600"
      "2": "1200"
      "3": "1800"
      "4": "2400"
      "5": "4800"
      "6": "9600"
      "7": "14400"
      "8": "19200"
      "9": "28800"
      "10": "38400"
      "11": "57600"
      "12": "115200"
      "13": "230400"
      "14": "460800"
      "15": "921600"
      "16": {value: "1M", min_version: "1.2.1"}
      "17": {value: "2M", min_version: "1.2.1"}
      "18": {value: "4M", min_version: "1.2.1"}
      "19": {value: "8M", min_version: "1.2.1"}
  OP:
    regex: "^[0-6]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
      "4": "SSL TCP Client mode"
      "5": "MQTT Client"
      "6": "MQTTS Client"

fw_constraints:
  upload_supported: true
  config_port: 50001

ui:
  tabs:
    - id: network
      label: "Network"
      groups:
        - device_info
        - ip_mode
        - op_mode
        - conn_password
        - ssl_options
    - id: serial
      label: "Serial (CH0)"
      groups:
        - serial_info
        - serial_params
        - data_packing
    - id: channel1
      label: "Channel 1"
      groups:
        - ch1_info
        - ch1_op_mode
        - ch1_serial
        - ch1_packing
        - ch1_options
        - ch1_connection_events
    - id: options
      label: "Options"
      groups:
        - inactivity
        - keepalive
        - trigger
        - search_password
        - tcp_options
        - connection_events
    - id: mqtt
      label: "MQTT"
      groups:
        - mqtt_options
        - mqtt_topics
    - id: certificate
      label: "Certificate"
      groups:
        - cert_options
        - cert_upload

# 펌웨어 이미지 판별 프로파일 — config/fw_image_defaults.yaml 참조
fw_image:
  profile: rp2040_w55rp20
