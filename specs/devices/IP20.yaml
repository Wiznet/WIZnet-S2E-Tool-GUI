# IP20.yaml
# W55RP20 칩 기반 단일 채널 장비 (W55RP20-S2E와 동일 커맨드셋)

name: IP20
display_name: "IP20"
aliases:
  - "IP20"
family: security
channels: 1

command_groups:
  - base
  - retransmit
  - security
  - w55rp20_ext
  # 2026-09-08: 이 기종의 FW 소스가 없다. 확인할 수 없는 것을 주장하지 않으려고
  # 설정툴이 실제로 묻는 커맨드만 부분 include 한다(WIZMakeCMD.cmd_security_base 계열).
  # PO 는 W55RP20 펌웨어와 같은 계열이므로 Modbus 의미(0~2)로 본다 — telnet(0~1)을
  # 쓰면 2 가 거부된다. MB 는 묻지 않아 넣지 않는다.

# 그룹 전체가 아니라 이것만 — 이 기종의 FW 소스가 없어 DDNS 전체 지원 여부를
# 확인할 수 없다. 설정툴이 묻는 것은 도메인(DH) 뿐이므로 그것만 주장한다.
partial_command_groups:
  ddns: [DH]
  gpio: [SC]
  modbus: [PO]


overrides:
  # [FW 소스 대조 2026-10-20] 칸 크기-1 = 최대 글자 수. 이 값을 넘기면 오류 없이 이웃 필드가
  # 덮이거나(검사 없는 strcpy) INVALIDPARAM 으로 같은 요청의 SV 가 취소된다.
  # 근거: doc/fw/FW-SOURCE-w55rp20-other-branches §7 #4 (같은 소스의 보드 선택지, CMakeLists.txt:50-58)
  RH:
    regex: "^(?=.{0,127}$)( ?|(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])|([A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?\\.)*[A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?)$"
  SP:
    regex: "^.{0,9}$"
  QU:
    regex: "^.{0,127}$"
  QP:
    regex: "^.{0,127}$"
  QC:
    regex: "^.{0,127}$"
  PU:
    regex: "^.{0,127}$"
  U0:
    regex: "^.{0,127}$"
  U1:
    regex: "^.{0,127}$"
  U2:
    regex: "^.{0,127}$"
  NP:
    regex: "^.{0,9}$"
  # 고속 Baudrate (FW >= 1.2.1에서 index 0-19 지원, W55RP20-S2E와 동일 — IP20은 W55RP20 칩 사용)
  # 근거: wizcmdset.py get_cmdset() name in ("W55RP20-S2E", "IP20") → W55RP20_CMDSET (BR 0-19)
  #       + 커밋 5a638bb "Integrate IP20 into W55RP20_CMDSET for high-speed baudrate support" (2026-02-10)
  # FW 버전에 따라 device_spec_loader가 런타임에 조정
  BR:
    regex: "^([0-9]|1[0-9])$"
    values:
      "0": "300"
      "1": "600"
      "2": "1200"
      "3": "1800"
      "4": "2400"
      "5": "4800"
      "6": "9600"
      "7": "14400"
      "8": "19200"
      "9": "28800"
      "10": "38400"
      "11": "57600"
      "12": "115200"
      "13": "230400"
      "14": "460800"
      "15": "921600"
      "16": {value: "1M", min_version: "1.2.1"}
      "17": {value: "2M", min_version: "1.2.1"}
      "18": {value: "4M", min_version: "1.2.1"}
      "19": {value: "8M", min_version: "1.2.1"}
  OP:
    regex: "^[0-6]$"
    values:
      "0": "TCP Client mode"
      "1": "TCP Server mode"
      "2": "TCP Mixed mode"
      "3": "UDP mode"
      "4": "SSL TCP Client mode"
      "5": "MQTT Client"
      "6": "MQTTS Client"

fw_constraints:
  upload_supported: true
  config_port: 50001

ui:
  tabs:
    - id: network
      label: "Network"
      groups:
        - device_info
        - ip_mode
        - op_mode
        - conn_password
        - ssl_options
    - id: serial
      label: "Serial"
      groups:
        - serial_info
        - serial_params
        - data_packing
    - id: options
      label: "Options"
      groups:
        - inactivity
        - keepalive
        - trigger
        - search_password
        - tcp_options
        - connection_events
    - id: mqtt
      label: "MQTT"
      groups:
        - mqtt_options
        - mqtt_topics
    - id: certificate
      label: "Certificate"
      groups:
        - cert_options
        - cert_upload

# 펌웨어 이미지 판별 프로파일 — config/fw_image_defaults.yaml 참조
fw_image:
  profile: rp2040_w55rp20
