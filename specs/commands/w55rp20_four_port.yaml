# w55rp20_four_port.yaml
# W55RP20-S2E-4CH 전용 채널 3 (CH3) 커맨드
# w55rp20_three_port.yaml(CH2)의 순수 미러 — 2글자 코드만 치환. 값 범위/선택지는 CH0/CH1과 동일.
# 소스 기준: 펌웨어 GreenCS segcp.h/segcp.c (de622f8 "Add SEGCP support for channels 2 and 3")
#
# CH2 → CH3 코드 매핑 (24개):
#   GS→CS  WN→YN  TO→JO  GL→CL  GH→CH  TP→JP  WB→YB  WD→YD  WP→YP  WS→YS
#   WF→YF  HD→UD  HS→US  TT→JT  XV→ZV  XR→ZR  XA→ZA  XS→ZS  XE→ZE  XO→ZO
#   YO(모드버스)  ZD  ZF  YE
#   (펌웨어의 YI(UART IF 번호)는 CH2의 WI와 동일 사유로 미포함 — CH0/CH1 대칭 유지)
#
# baud(YB)는 그룹에서 0-15, device spec override로 16-19(고속) 추가 — EB/WB와 동일 패턴.
#
# 주의: CH3 물리 시리얼은 CH0 RS-485 버스를 공유한다. serial 파라미터(YB/YD/YP/YS/YF)는
#       표시상 존재하나 실제 버스는 CH0 설정을 따르므로 실효가 없다.

CS:
  description: "Operation status for channel 3"
  regex: ""
  values: {}
  access: RO
  ui:
    tab: channel3
    group: ch3_info
    widget: label
    label: "CH3 Status"
    order: 1

YN:
  description: "UART Interface (Str) for channel 3"
  regex: ""
  values: {}
  access: RO
  ui:
    tab: channel3
    group: ch3_info
    widget: label
    label: "CH3 UART Interface"
    order: 2

JO:
  description: "Network Operation Mode for channel 3 - Extended"
  regex: "^[0-6]$"
  values:
    "0": "TCP Client mode"
    "1": "TCP Server mode"
    "2": "TCP Mixed mode"
    "3": "UDP mode"
    "4": "SSL TCP Client mode"
    "5": "MQTT Client"
    "6": "MQTTS Client"
  access: RW
  ui:
    tab: channel3
    group: ch3_op_mode
    widget: radiogroup
    label: "CH3 Operation Mode"
    order: 1

CL:
  description: "Local port number for channel 3"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_op_mode
    widget: lineedit
    label: "CH3 Local Port"
    order: 2

CH:
  description: "Remote Host IP address for channel 3"
  regex: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_op_mode
    widget: lineedit
    label: "CH3 Remote Host"
    order: 3
    depends_on: {JO: ["0", "2", "3", "4"]}

JP:
  description: "Remote Host Port number for channel 3"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_op_mode
    widget: lineedit
    label: "CH3 Remote Port"
    order: 4
    depends_on: {JO: ["0", "2", "3", "4"]}

ZR:
  description: "TCP Reconnection Interval for channel 3 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_op_mode
    widget: lineedit
    label: "CH3 Reconnection Interval (ms)"
    order: 5

YB:
  description: "UART channel 3 Baud rate"
  regex: "^([0-9]|1[0-5])$"
  values:
    "0": "300"
    "1": "600"
    "2": "1200"
    "3": "1800"
    "4": "2400"
    "5": "4800"
    "6": "9600"
    "7": "14400"
    "8": "19200"
    "9": "28800"
    "10": "38400"
    "11": "57600"
    "12": "115200"
    "13": "230400"
    "14": "460800"
    "15": "921600"
  access: RW
  ui:
    tab: channel3
    group: ch3_serial
    widget: combobox
    label: "CH3 Baud Rate"
    order: 1

YD:
  description: "UART channel 3 Data bit length"
  regex: "^[0-1]$"
  values:
    "0": "7-bit"
    "1": "8-bit"
  access: RW
  ui:
    tab: channel3
    group: ch3_serial
    widget: combobox
    label: "CH3 Data Bits"
    order: 2

YP:
  description: "UART channel 3 Parity bit"
  regex: "^[0-2]$"
  values:
    "0": "NONE"
    "1": "ODD"
    "2": "EVEN"
  access: RW
  ui:
    tab: channel3
    group: ch3_serial
    widget: combobox
    label: "CH3 Parity"
    order: 3

YS:
  description: "UART channel 3 Stop bit length"
  regex: "^[0-1]$"
  values:
    "0": "1-bit"
    "1": "2-bit"
  access: RW
  ui:
    tab: channel3
    group: ch3_serial
    widget: combobox
    label: "CH3 Stop Bits"
    order: 4

YF:
  description: "UART channel 3 Flow Control"
  regex: "^[0-2]$"
  values:
    "0": "NONE"
    "1": "XON/XOFF"
    "2": "RTS/CTS"
  access: RW
  ui:
    tab: channel3
    group: ch3_serial
    widget: combobox
    label: "CH3 Flow Control"
    order: 5

JT:
  description: "Time Delimiter for channel 3 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_packing
    widget: lineedit
    label: "CH3 Timer (ms)"
    order: 1

US:
  description: "Size Delimiter for channel 3 (bytes)"
  regex: "^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_packing
    widget: lineedit
    label: "CH3 Size (bytes)"
    order: 2

UD:
  description: "Char Delimiter for channel 3 (hex)"
  regex: "^([0-9a-fA-F][0-9a-fA-F])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_packing
    widget: lineedit
    label: "CH3 Character (hex)"
    order: 3

ZV:
  description: "Inactivity Timer Value for channel 3 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_options
    widget: lineedit
    label: "CH3 Inactivity Timer (ms)"
    order: 1

ZA:
  description: "TCP Keep-alive Enable for channel 3"
  regex: "^[0-1]$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_options
    widget: checkbox
    label: "CH3 Keep-alive"
    order: 2

ZS:
  description: "TCP Keep-alive Initial Interval for channel 3 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_options
    widget: lineedit
    label: "CH3 KA Initial (ms)"
    order: 3
    depends_on: {ZA: "1"}

ZE:
  description: "TCP Keep-alive Retry Interval for channel 3 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_options
    widget: lineedit
    label: "CH3 KA Retry (ms)"
    order: 4
    depends_on: {ZA: "1"}

ZO:
  description: "SSL receive timeout for channel 3"
  regex: ""
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_options
    widget: lineedit
    label: "CH3 SSL Timeout"
    order: 5

YO:
  description: "Modbus protocol for channel 3"
  regex: "^[0-2]$"
  values:
    "0": "Serial to Ethernet"
    "1": "RTU to TCP"
    "2": "ASCII to TCP"
  access: RW
  ui:
    tab: channel3
    group: ch3_options
    widget: combobox
    label: "CH3 Modbus Protocol"
    order: 6

ZD:
  description: "Send Data at Connection for channel 3 (max 30 chars)"
  regex: "^.{0,30}$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_connection_events
    widget: lineedit
    label: "CH3 Serial Data at Connection"
    order: 1

ZF:
  description: "Send Data at Disconnection for channel 3 (max 30 chars)"
  regex: "^.{0,30}$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_connection_events
    widget: lineedit
    label: "CH3 Serial Data at Disconnection"
    order: 2

YE:
  description: "Ethernet Connection Condition for channel 3 (max 30 chars)"
  regex: "^.{0,30}$"
  values: {}
  access: RW
  ui:
    tab: channel3
    group: ch3_connection_events
    widget: lineedit
    label: "CH3 Ethernet Connection Condition"
    order: 3
