# w55rp20_three_port.yaml
# W55RP20-S2E-3CH 전용 채널 2 (CH2) 커맨드
# w55rp20_two_port.yaml(CH1)의 순수 복제 — 2글자 코드만 치환. 값 범위/선택지는 CH0/CH1과 동일.
# 소스 기준: 펌웨어 커밋 de622f8 (DEVICE_UART_CNT=3)
#
# CH1 → CH2 코드 매핑 (24개):
#   AO→TO  QS→GS  QL→GL  QH→GH  AP→TP  EB→WB  ED→WD  EP→WP  ES→WS  EF→WF
#   EO→WO  RV→XV  RR→XR  RA→XA  RS→XS  RE→XE  AT→TT  NS→HS  ND→HD  RO→XO
#   EN→WN  RD→XD  RF→XF  EE→WE
#
# baud(WB)는 그룹에서 0-15, device spec override로 16-19(고속) 추가 — EB와 동일 패턴.
#
# 주의: CH2 물리 시리얼은 CH0 RS-485 버스를 공유한다. serial 파라미터(WB/WD/WP/WS/WF)는
#       표시상 존재하나 실제 버스는 CH0 설정을 따르므로 실효가 없다.

GS:
  description: "Operation status for channel 2"
  regex: ""
  values: {}
  access: RO
  ui:
    tab: channel2
    group: ch2_info
    widget: label
    label: "CH2 Status"
    order: 1

WN:
  description: "UART Interface (Str) for channel 2"
  regex: ""
  values: {}
  access: RO
  ui:
    tab: channel2
    group: ch2_info
    widget: label
    label: "CH2 UART Interface"
    order: 2

TO:
  description: "Network Operation Mode for channel 2 - Extended"
  regex: "^[0-6]$"
  values:
    "0": "TCP Client mode"
    "1": "TCP Server mode"
    "2": "TCP Mixed mode"
    "3": "UDP mode"
    "4": "SSL TCP Client mode"
    "5": "MQTT Client"
    "6": "MQTTS Client"
  access: RW
  ui:
    tab: channel2
    group: ch2_op_mode
    widget: radiogroup
    label: "CH2 Operation Mode"
    order: 1

GL:
  description: "Local port number for channel 2"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_op_mode
    widget: lineedit
    label: "CH2 Local Port"
    order: 2

GH:
  description: "Remote Host IP address for channel 2"
  regex: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_op_mode
    widget: lineedit
    label: "CH2 Remote Host"
    order: 3
    depends_on: {TO: ["0", "2", "3", "4"]}

TP:
  description: "Remote Host Port number for channel 2"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_op_mode
    widget: lineedit
    label: "CH2 Remote Port"
    order: 4
    depends_on: {TO: ["0", "2", "3", "4"]}

XR:
  description: "TCP Reconnection Interval for channel 2 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_op_mode
    widget: lineedit
    label: "CH2 Reconnection Interval (ms)"
    order: 5

WB:
  description: "UART channel 2 Baud rate"
  regex: "^([0-9]|1[0-5])$"
  values:
    "0": "300"
    "1": "600"
    "2": "1200"
    "3": "1800"
    "4": "2400"
    "5": "4800"
    "6": "9600"
    "7": "14400"
    "8": "19200"
    "9": "28800"
    "10": "38400"
    "11": "57600"
    "12": "115200"
    "13": "230400"
    "14": "460800"
    "15": "921600"
  access: RW
  ui:
    tab: channel2
    group: ch2_serial
    widget: combobox
    label: "CH2 Baud Rate"
    order: 1

WD:
  description: "UART channel 2 Data bit length"
  regex: "^[0-1]$"
  values:
    "0": "7-bit"
    "1": "8-bit"
  access: RW
  ui:
    tab: channel2
    group: ch2_serial
    widget: combobox
    label: "CH2 Data Bits"
    order: 2

WP:
  description: "UART channel 2 Parity bit"
  regex: "^[0-2]$"
  values:
    "0": "NONE"
    "1": "ODD"
    "2": "EVEN"
  access: RW
  ui:
    tab: channel2
    group: ch2_serial
    widget: combobox
    label: "CH2 Parity"
    order: 3

WS:
  description: "UART channel 2 Stop bit length"
  regex: "^[0-1]$"
  values:
    "0": "1-bit"
    "1": "2-bit"
  access: RW
  ui:
    tab: channel2
    group: ch2_serial
    widget: combobox
    label: "CH2 Stop Bits"
    order: 4

WF:
  description: "UART channel 2 Flow Control"
  regex: "^[0-2]$"
  values:
    "0": "NONE"
    "1": "XON/XOFF"
    "2": "RTS/CTS"
  access: RW
  ui:
    tab: channel2
    group: ch2_serial
    widget: combobox
    label: "CH2 Flow Control"
    order: 5

TT:
  description: "Time Delimiter for channel 2 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_packing
    widget: lineedit
    label: "CH2 Timer (ms)"
    order: 1

HS:
  description: "Size Delimiter for channel 2 (bytes)"
  regex: "^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_packing
    widget: lineedit
    label: "CH2 Size (bytes)"
    order: 2

HD:
  description: "Char Delimiter for channel 2 (hex)"
  regex: "^([0-9a-fA-F][0-9a-fA-F])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_packing
    widget: lineedit
    label: "CH2 Character (hex)"
    order: 3

XV:
  description: "Inactivity Timer Value for channel 2 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_options
    widget: lineedit
    label: "CH2 Inactivity Timer (ms)"
    order: 1

XA:
  description: "TCP Keep-alive Enable for channel 2"
  regex: "^[0-1]$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_options
    widget: checkbox
    label: "CH2 Keep-alive"
    order: 2

XS:
  description: "TCP Keep-alive Initial Interval for channel 2 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_options
    widget: lineedit
    label: "CH2 KA Initial (ms)"
    order: 3
    depends_on: {XA: "1"}

XE:
  description: "TCP Keep-alive Retry Interval for channel 2 (ms)"
  regex: "^([0-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_options
    widget: lineedit
    label: "CH2 KA Retry (ms)"
    order: 4
    depends_on: {XA: "1"}

XO:
  description: "SSL receive timeout for channel 2"
  regex: ""
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_options
    widget: lineedit
    label: "CH2 SSL Timeout"
    order: 5

WO:
  description: "Modbus protocol for channel 2"
  regex: "^[0-2]$"
  values:
    "0": "Serial to Ethernet"
    "1": "RTU to TCP"
    "2": "ASCII to TCP"
  access: RW
  ui:
    tab: channel2
    group: ch2_options
    widget: combobox
    label: "CH2 Modbus Protocol"
    order: 6

XD:
  description: "Send Data at Connection for channel 2 (max 30 chars)"
  regex: "^.{0,30}$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_connection_events
    widget: lineedit
    label: "CH2 Serial Data at Connection"
    order: 1

XF:
  description: "Send Data at Disconnection for channel 2 (max 30 chars)"
  regex: "^.{0,30}$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_connection_events
    widget: lineedit
    label: "CH2 Serial Data at Disconnection"
    order: 2

WE:
  description: "Ethernet Connection Condition for channel 2 (max 30 chars)"
  regex: "^.{0,30}$"
  values: {}
  access: RW
  ui:
    tab: channel2
    group: ch2_connection_events
    widget: lineedit
    label: "CH2 Ethernet Connection Condition"
    order: 3
